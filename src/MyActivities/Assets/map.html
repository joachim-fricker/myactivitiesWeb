<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; }
  /* Heatmap: Grundkarte entsättigt, damit die Farben hervorstechen */
  body.country-mode #map { background: #cfe3ee; }
  body.heat-mode .leaflet-tile-pane { filter: saturate(0.15); opacity: 0.85; }
  .legend { background: rgba(255,255,255,.9); padding: 6px 10px; border-radius: 6px;
            font: 13px "Segoe UI", sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .legend span { display: inline-block; width: 11px; height: 11px; border-radius: 50%;
                 margin-right: 6px; vertical-align: -1px; border: 1px solid #fff; }
  .leaflet-popup-content { font: 13px "Segoe UI", sans-serif; }
  .leaflet-popup-content a.details { display: inline-block; margin-top: 6px; font-weight: 600; }
  .leaflet-container .leaflet-marker-pane .photo-icon {
    background: transparent; border: none;
  }
  /* Leaflet setzt für Bilder in Markern width:auto – hier fest quadratisch, damit ein Kreis entsteht */
  .leaflet-container .leaflet-marker-pane .photo-icon img {
    width: 40px !important; height: 40px !important; box-sizing: border-box;
    object-fit: cover; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); background: #ddd;
  }
</style>
</head>
<body>
<div id="map"></div>
<script>
  const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17, attribution: '© OpenStreetMap-Mitwirkende, SRTM | © OpenTopoMap'
  });
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap-Mitwirkende'
  });
  const swiss = L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg', {
    maxZoom: 18, attribution: '© swisstopo'
  });
  // maxZoom fest setzen: ohne Grundkarte (Länderkarte) kennt Leaflet sonst keine Maximalstufe,
  // und die Gruppierung (markercluster) verweigert den Dienst
  const map = L.map('map', { layers: [osm], maxZoom: 19 }).setView([47.4, 8.5], 8);
  const layersControl = L.control.layers({ 'Karte': osm, 'Topo': topo, 'Landeskarte (CH)': swiss }).addTo(map);

  const post = msg => window.chrome.webview.postMessage(JSON.stringify(msg));

  // Reihenfolge: geöffnete Tracks unten, ausgewählte Tour (overlay) darüber
  const tracksLayer = L.layerGroup().addTo(map);
  let overlay = L.layerGroup().addTo(map);
  const bringOverlayToFront = () => overlay.eachLayer(l => l.bringToFront && l.bringToFront());

  function clearTrack() {
    overlay.clearLayers();
  }

  // points: [[lat, lon], ...]
  function showTrack(points) {
    map.invalidateSize();
    clearTrack();
    if (!points || points.length < 2) return;
    L.polyline(points, { color: '#fff', weight: 7, opacity: 0.8, interactive: false }).addTo(overlay);
    const line = L.polyline(points, { color: '#e53935', weight: 4.5 }).addTo(overlay);
    L.circleMarker(points[0], { radius: 6, color: '#fff', weight: 2, fillColor: '#2a9d8f', fillOpacity: 1 }).addTo(overlay);
    L.circleMarker(points[points.length - 1], { radius: 6, color: '#fff', weight: 2, fillColor: '#e63946', fillOpacity: 1 }).addTo(overlay);
    map.fitBounds(line.getBounds(), { padding: [20, 20] });
  }

  // photos: [{ i: Index, lat, lon, url }, ...]; Klick meldet den Index an die App
  function showPhotos(photos) {
    (photos || []).forEach(p => {
      const icon = L.divIcon({ className: 'photo-icon', html: `<img src="${p.url}" loading="lazy">`,
                               iconSize: [44, 44], iconAnchor: [22, 22] });
      L.marker([p.lat, p.lon], { icon: icon, zIndexOffset: 1000 })
        .on('click', () => post({ photo: p.i }))
        .addTo(overlay);
    });
  }

  // ---- Weltkarte: Startpunkte aller Touren
  let starts = null;
  let startsData = [];
  let openedIds = new Set();

  // Meldet der App, wie viele Touren im Ausschnitt liegen (und wie viele davon noch nicht geöffnet sind)
  function reportView() {
    if (!startsData.length && !openedIds.size) return;
    const b = map.getBounds();
    const inView = startsData.filter(a => b.contains([a.lat, a.lon]));
    post({ view: { count: inView.length, closed: inView.filter(a => !openedIds.has(String(a.id))).length, zoom: map.getZoom() } });
  }
  map.on('moveend', reportView);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // list: [{ id, lat, lon, c: Farbe, n: Name, d: Datum, t: Typ, info: "12,3 km · 456 Hm · 2:10" }, ...]
  // bounds: [[lat1, lon1], [lat2, lon2]] oder null (Ausschnitt nicht ändern)
  function showStarts(list, bounds) {
    if (starts) map.removeLayer(starts);
    startsData = list || [];
    starts = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 });
    // Einzelne Tour sieht aus wie eine Gruppe mit "1" (gleicher grüner Kreis)
    const single = L.divIcon({ html: '<div><span>1</span></div>', className: 'marker-cluster marker-cluster-small',
                               iconSize: L.point(40, 40) });
    (list || []).forEach(a => {
      const m = L.marker([a.lat, a.lon], { icon: single });
      m.bindPopup(`<b>${esc(a.n)}</b><br>${esc(a.d)} · ${esc(a.t)}<br>${esc(a.info)}` +
                  `<br><a href="#" class="details" onclick="post({ details: '${a.id}' }); return false;">Details anzeigen</a>`);
      m.on('click', () => post({ select: a.id }));
      starts.addLayer(m);
    });
    map.addLayer(starts);
    if (bounds) fitArea(bounds);
    reportView();
  }

  function fitArea(bounds) {
    map.invalidateSize();
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
  }

  // IDs der Startpunkte im sichtbaren Kartenausschnitt
  function startsInView() {
    const b = map.getBounds();
    // als Text, damit die langen IDs unverändert in C# ankommen
    return startsData.filter(a => b.contains([a.lat, a.lon])).map(a => String(a.id));
  }

  // Geöffnete Tracks: [{ id, p: [[lat, lon], ...] }, ...]; Klick wählt die Tour aus
  function showTracks(list) {
    tracksLayer.clearLayers();
    openedIds = new Set((list || []).map(t => String(t.id)));
    (list || []).forEach(t => {
      L.polyline(t.p, { color: '#fff', weight: 6, opacity: 0.7, interactive: false }).addTo(tracksLayer);
      L.polyline(t.p, { color: '#7b1fa2', weight: 3.5 }).on('click', () => post({ select: t.id })).addTo(tracksLayer);
    });
    bringOverlayToFront();
    reportView();
  }

  // items: [{ c: Farbe, l: Bezeichnung }, ...]
  let legend = null;
  function setLegend(items) {
    if (legend) legend.remove();
    legend = L.control({ position: 'bottomleft' });
    legend.onAdd = () => {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = items.map(i => `<div><span style="background:${i.c}"></span>${esc(i.l)}</div>`).join('');
      return div;
    };
    legend.addTo(map);
  }

  // ---- Heatmap aller Tracks
  const canvasRenderer = L.canvas({ padding: 0.5 });
  let heatLayer = null, heatLines = null, heatTracks = [];
  const HEAT_LINES_FROM_ZOOM = 12;   // ab hier einzelne Linien statt Heatmap
  const HEAT_CLICK_FROM_ZOOM = 11;   // ab hier zeigt ein Klick die Touren dort

  // Punkte alle stepM Meter entlang des Tracks (gleichmäßige Dichte für die Heatmap)
  function resample(pts, stepM) {
    const out = [pts[0]];
    let carry = 0;
    for (let i = 1; i < pts.length; i++) {
      const a = L.latLng(pts[i - 1]), b = L.latLng(pts[i]);
      const d = a.distanceTo(b);
      let pos = stepM - carry;
      while (pos <= d) {
        const f = pos / d;
        out.push([a.lat + f * (b.lat - a.lat), a.lng + f * (b.lng - a.lng)]);
        pos += stepM;
      }
      carry = d - (pos - stepM);
    }
    return out;
  }

  function heatRadius(z) { return z < 6 ? 3 : z < 9 ? 5 : z < 11 ? 7 : 10; }

  function updateHeatZoom() {
    if (!heatLayer) return;
    const z = map.getZoom();
    const showLines = z >= HEAT_LINES_FROM_ZOOM;
    if (showLines) { map.removeLayer(heatLayer); if (!map.hasLayer(heatLines)) heatLines.addTo(map); }
    else { map.removeLayer(heatLines); if (!map.hasLayer(heatLayer)) heatLayer.addTo(map); heatLayer.setOptions({ radius: heatRadius(z), blur: heatRadius(z) * 1.3 }); }
  }
  map.on('zoomend', updateHeatZoom);

  // tracks: [{ id: "123", p: [[lat, lon], ...] }, ...]; bounds wie bei showStarts
  function showHeat(tracks, bounds) {
    document.body.classList.add('heat-mode');
    if (heatLayer) map.removeLayer(heatLayer);
    if (heatLines) map.removeLayer(heatLines);
    heatTracks = (tracks || []).filter(t => t.p && t.p.length >= 2);
    heatTracks.forEach(t => t.b = L.latLngBounds(t.p).pad(0.05));

    const pts = [];
    heatTracks.forEach(t => resample(t.p, 250).forEach(q => pts.push([q[0], q[1], 0.5])));
    heatLayer = L.heatLayer(pts, {
      radius: 7, blur: 9, maxZoom: 12, minOpacity: 0.25,
      gradient: { 0.1: '#4169e1', 0.3: '#00bedc', 0.5: '#78dc50', 0.7: '#ffd700', 0.9: '#ff7800', 1.0: '#dc1414' }
    });
    heatLines = L.layerGroup(heatTracks.map(t =>
      L.polyline(t.p, { color: '#c62828', weight: 2.5, opacity: 0.35, interactive: false, renderer: canvasRenderer })));
    if (bounds) fitArea(bounds);
    updateHeatZoom();
  }

  // Klick (reingezoomt): welche Touren führen hier durch?
  map.on('click', e => {
    if (!heatTracks.length) return;
    if (map.getZoom() < HEAT_CLICK_FROM_ZOOM) { post({ near: [], tooFar: true }); return; }
    const p = map.latLngToLayerPoint(e.latlng);
    const ids = [];
    for (const t of heatTracks) {
      if (!t.b.contains(e.latlng)) continue;
      let prev = map.latLngToLayerPoint(t.p[0]);
      for (let i = 1; i < t.p.length; i++) {
        const cur = map.latLngToLayerPoint(t.p[i]);
        if (L.LineUtil.pointToSegmentDistance(p, prev, cur) < 12) { ids.push(String(t.id)); break; }
        prev = cur;
      }
    }
    post({ near: ids });
  });

  // große Datenmengen kommen per PostWebMessageAsJson statt ExecuteScript
  window.chrome.webview.addEventListener('message', e => {
    if (e.data && e.data.heat) showHeat(e.data.heat, e.data.bounds);
    if (e.data && e.data.countryPhotos !== undefined) showCountryPhotos(e.data.countryPhotos);
  });

  // ---- Länderkarte: besuchte Länder eingefärbt, ohne Grundkarte
  let countryData = null, countryLayer = null, countryVisited = new Set(), countrySelected = null;

  function countryStyle(f) {
    const visited = countryVisited.has(f.properties.id);
    const selected = f.properties.id === countrySelected;
    return {
      color: selected ? '#c62828' : '#ffffff', weight: selected ? 2.5 : 0.7,
      fillColor: visited ? '#43a047' : '#dcdcdc', fillOpacity: visited ? 0.85 : 1
    };
  }

  async function showCountries(visited) {
    document.body.classList.add('country-mode');
    map.eachLayer(l => { if (l instanceof L.TileLayer) map.removeLayer(l); });
    layersControl.remove();
    countryVisited = new Set(visited || []);
    if (!countryData) countryData = await (await fetch('https://app.local/countries.geojson')).json();
    if (countryLayer) map.removeLayer(countryLayer);
    countryLayer = L.geoJSON(countryData, {
      style: countryStyle,
      onEachFeature: (f, layer) => {
        layer.bindTooltip(f.properties.name, { sticky: true });
        layer.on('click', () => post({ country: f.properties.id }));
      }
    }).addTo(map);
    if (!countrySelected) map.setView([35, 10], 2);
  }

  // Aufnahmeorte der Fotos eines Landes: runde Fotos, nahe beieinander zu Gruppen zusammengefasst
  let photoCluster = null;
  let countryPhotoData = [];

  // Meldet der App, welche Fotos im Kartenausschnitt liegen (für den Fotostreifen)
  function reportCountryPhotos() {
    if (!countryPhotoData.length) return;
    const b = map.getBounds();
    post({ viewPhotos: countryPhotoData.filter(p => b.contains([p.lat, p.lon])).map(p => p.i) });
  }
  map.on('moveend', reportCountryPhotos);

  function showCountryPhotos(photos) {
    try {
      if (photoCluster) map.removeLayer(photoCluster);
      photoCluster = null;
      countryPhotoData = photos || [];
      if (!countryPhotoData.length) return;
      photoCluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 50 });
      const markers = photos.map(p => {
        const icon = L.divIcon({ className: 'photo-icon', html: `<img src="${p.url}">`,
                                 iconSize: [44, 44], iconAnchor: [22, 22] });
        return L.marker([p.lat, p.lon], { icon: icon }).on('click', () => post({ photo: p.i }));
      });
      photoCluster.addLayers(markers);
      map.addLayer(photoCluster);
      reportCountryPhotos();
    } catch (err) {
      post({ log: 'Fehler beim Anzeigen der Aufnahmeorte: ' + err });
    }
  }

  function selectCountry(id, zoom) {
    countrySelected = id;
    if (!countryLayer) return;
    countryLayer.setStyle(countryStyle);
    countryLayer.eachLayer(l => {
      if (l.feature.properties.id !== id) return;
      l.bringToFront();
      if (zoom) map.fitBounds(l.getBounds(), { padding: [30, 30], maxZoom: 6 });
    });
  }

  function showPoint(lat, lon) {
    map.invalidateSize();
    clearTrack();
    L.marker([lat, lon]).addTo(overlay);
    map.setView([lat, lon], 13);
  }
</script>
</body>
</html>
